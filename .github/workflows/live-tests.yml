name: ☁️ Live tests
on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      suite:
        description: Select metadata-only checks or explicitly authorize the selected paid SV1 workload
        type: choice
        options:
          - metadata
          - sv1
        default: metadata
        required: true
permissions:
  contents: read

jobs:
  metadata:
    name: ☁️ Live metadata · Braket
    if: >-
      inputs.suite == 'metadata' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment:
      name: braket-metadata
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Run checks
        run: |
          cmake -S . -B build/live -DCMAKE_BUILD_TYPE=Release -DBUILD_AMAZON_BRAKET_LIVE_TESTS=ON
          cmake --build build/live --parallel 4

      - name: Assume metadata-only AWS role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Query catalogue without submissions
        env:
          AMAZON_BRAKET_QDMI_RUN_LIVE_CATALOG: "1"
        run: ctest --test-dir build/live -R '^live::AmazonBraketQDMILiveTest.OpensInstalledCatalog$' --output-on-failure --timeout 600 --parallel 1

  sv1:
    name: 💸 Live tests · Braket SV1
    if: inputs.suite == 'sv1' && (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment:
      name: braket-sv1
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: braket-sv1-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Run checks
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 4
          ctest --preset release

      - name: Build and test candidate wheel offline
        run: |
          uv build --wheel --out-dir build/live/dist
          uv venv build/live/venv
          uv pip install --python build/live/venv/bin/python --group test build/live/dist/*.whl
          build/live/venv/bin/python -m pytest

      - name: Assume SV1 AWS role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run selected SV1 smoke test
        run: build/live/venv/bin/python -m pytest test/python/test_pennylane_qaoa.py -m live -k cost_capped_on_sv1 -n 0 --tb=line --show-capture=no
