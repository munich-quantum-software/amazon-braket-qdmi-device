name: 🇨 • SPANK • ubuntu
on:
  workflow_call:

permissions:
  contents: read

jobs:
  cpp-spank-tests-ubuntu:
    name: 🐧 Slurm 25.11 • ${{ matrix.install-mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        install-mode: [native, wheel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: provider

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: munich-quantum-toolkit/core
          ref: a4d416e7b301c58a6e41a347ade26dd503766f18
          persist-credentials: false
          path: core

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"

      - name: Download released Core runtime
        run: >-
          uvx pip download --only-binary=:all: --no-deps --dest dist mqt-core==4.0.0

      - name: Run provider workload with the shared Slurm fixture
        env:
          PROVIDER_INSTALL_MODE: ${{ matrix.install-mode }}
        run: >-
          uv run --no-project core/test/slurm/run_integration.py
          --workload provider --dist dist
          --setup-script test/slurm/setup.sh
          --compose-file provider/test/slurm/compose.yml
          --device-license amazon.braket.sv1
          --qdmi-config-file /opt/provider-catalogue.json
          --reference AWS_EC2_METADATA_DISABLED=true
          --reference AWS_ENDPOINT_URL_BRAKET=http://braket:18080
          --reference AWS_ENDPOINT_URL_S3=http://braket:18080
          --reference AWS_PROFILE=spank-test
          --reference AWS_CONFIG_FILE=/workload/test/slurm/aws_config
          --reference AMZN_BRAKET_TASK_RESULTS_S3_URI=s3://fixture-bucket/tasks
          -- python3 /workload/test/slurm/probe.py
