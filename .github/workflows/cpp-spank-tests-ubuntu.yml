name: 🇨 • SPANK • ubuntu
on:
  workflow_call:

jobs:
  cpp-spank-tests-ubuntu:
    name: 🐧 ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build real-Slurm test image
        run: docker build --tag amazon-braket-qdmi-spank-tests --file spank/Dockerfile .

      - name: Run real-Slurm SPANK tests
        run: docker run --rm amazon-braket-qdmi-spank-tests
