name: 🇨 • SPANK • ubuntu
on:
  workflow_call:

jobs:
  cpp-spank-tests-ubuntu:
    name: 🐧 Slurm 23.11 • Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build real-Slurm test image
        run: docker build --tag amazon-braket-qdmi-spank-tests --file spank/Dockerfile .

      - name: Run real-Slurm SPANK tests
        # Slurm creates a cgroup-v2 scope for slurmstepd even when the fixture
        # uses proctrack/pgid and task/none.
        run: docker run --rm --privileged amazon-braket-qdmi-spank-tests
