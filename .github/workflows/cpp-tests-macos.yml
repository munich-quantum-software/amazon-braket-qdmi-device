name: 🇨 • Tests • macos
on:
  workflow_call:
    inputs:
      runs-on:
        description: "macOS runner image"
        required: true
        type: string
      preset-name:
        description: "CMake configure, build, and test preset"
        required: true
        type: string

permissions:
  contents: read

jobs:
  cpp-tests-macos:
    name: 🍎 ${{ inputs.runs-on }} clang ${{ inputs.preset-name }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
      PRESET_NAME: ${{ inputs.preset-name }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: 0
      SCCACHE_SKIP_CACHE_CHECK: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          brew install ninja openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure CMake
        run: >-
          cmake --preset "$PRESET_NAME"
          -DCMAKE_DISABLE_FIND_PACKAGE_s2n=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build --preset "$PRESET_NAME"

      - name: Test
        run: ctest --preset "$PRESET_NAME"
