name: 🧪 C++ tests
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          The ubuntu runner image to use. Defaults to 'ubuntu-latest'.
          This can be any valid ubuntu runner image, such as 'ubuntu-22.04', 'ubuntu-26.04', or their ARM variants 'ubuntu-22.04-arm', 'ubuntu-26.04-arm'.
        default: "ubuntu-latest"
        type: string
      preset-name:
        description: >
          The build type to use. Defaults to 'Release'.
          This can be any valid CMake build type, such as 'Debug' or 'Release'.
        default: "release"
        type: string

jobs:
  cpp-tests-ubuntu:
    name: 🐧 ${{ inputs.runs-on }} gcc ${{ inputs.preset-name }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
      PRESET_NAME: ${{ inputs.preset-name }}
    steps:
      # check out the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Install build dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
        # Set up ccache for faster C++ builds
      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@efeb0f4b0670854c2190fd2389da92c399ff5ceb # v1.5.10
        with:
          prepend_symlinks_to_path: false
          override_cache_key: c++-tests-${{ inputs.runs-on }}-${{ inputs.preset-name }}
          # Configure CMake in the specified mode, optionally with additional arguments
      - name: Configure CMake
        run: >-
          cmake --preset "$PRESET_NAME"

          # build the project in the specified mode
      - name: Build
        run:
          cmake --build --preset "$PRESET_NAME"
          # run the offline tests
      - name: Test
        run: ctest --preset "$PRESET_NAME"
