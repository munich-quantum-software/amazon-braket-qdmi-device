name: 🐍 Test
on:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    name: 🐍 ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.14"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Run checks
        run: uvx nox -s $SESSIONS --verbose -- --cov --cov-report=xml:coverage.xml --cov-append
        env:
          SESSIONS: ${{ github.event.pull_request.draft && 'tests-3.14 minimums-3.14' || 'tests minimums' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-ubuntu-26.04
          path: coverage.xml
          if-no-files-found: error
