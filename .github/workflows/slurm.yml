name: Slurm smoke test
on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  slurm-tests:
    name: Slurm smoke test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: provider

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: munich-quantum-toolkit/core
          ref: 575acd1b9ca52e4608ccf4833e7d60640913cef4 # v4.1.1
          fetch-depth: 0
          persist-credentials: false
          path: core

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.15"

      - name: Run the device workload
        timeout-minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          uv run --no-project core/test/slurm/run_integration.py \
            --workload provider --package /workload \
            --compose-file provider/test/slurm/compose.yml \
            --device-license amazon.braket.sv1 \
            -- python3 /workload/test/slurm/workload.py
