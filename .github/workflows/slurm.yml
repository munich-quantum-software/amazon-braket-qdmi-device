name: Slurm smoke test
on:
  workflow_call:
    inputs:
      reviewed-sha:
        description: "Immutable commit approved for authenticated testing."
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  slurm-tests:
    name: Slurm native and wheel smoke tests
    # Only a manual run from main may override the event commit.
    if: inputs.reviewed-sha == '' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: provider
          ref: ${{ inputs.reviewed-sha || github.sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: munich-quantum-toolkit/core
          # Shared Slurm integration from MQT Core #2599 until it is merged.
          ref: 7ba67c7914e7e801391bd825e6a5a50c7b4dfa86
          fetch-depth: 0
          persist-credentials: false
          path: core

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.15"

      - name: Run native and wheel workloads
        timeout-minutes: 40
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          for mode in native wheel; do
            PROVIDER_INSTALL_MODE="$mode" uv run \
              --no-project core/test/slurm/run_integration.py \
              --workload provider \
              --setup-script test/slurm/setup.sh \
              --compose-file provider/test/slurm/compose.yml \
              --device-license amazon.braket.sv1 \
              --qdmi-config-file /opt/provider-catalogue.json \
              -- python3 /workload/test/slurm/workload.py
            echo "Slurm $mode: eight SV1 shots through each of Qiskit and PennyLane passed." >> "$GITHUB_STEP_SUMMARY"
          done
