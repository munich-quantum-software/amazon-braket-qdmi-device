name: Slurm smoke test
on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  slurm-tests:
    name: Slurm native and wheel smoke tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: provider

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: munich-quantum-toolkit/core
          ref: 805aabf29a3ffb69dfa2c50fd423b497194561f0
          fetch-depth: 0
          persist-credentials: false
          path: core

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"

      - name: Set up MLIR
        uses: munich-quantum-software/setup-mlir@8d3eae73d0f0196fd30c787d91ebd2018cb6c709 # v1.5.0
        with:
          llvm-version: 23.1.2

      - name: Build MQT Core
        working-directory: core
        run: uv build --wheel --out-dir ../dist -Ccmake.define.DEPLOY=ON

      - name: Run native and wheel workloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::notice::Skipping Slurm live tests: AWS credentials are unavailable."
            echo "Slurm live tests skipped: AWS credentials are unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for mode in native wheel; do
            PROVIDER_INSTALL_MODE="$mode" uv run \
              --no-project core/test/slurm/run_integration.py \
              --workload provider \
              --dist dist \
              --setup-script test/slurm/setup.sh \
              --compose-file provider/test/slurm/compose.yml \
              --device-license amazon.braket.sv1 \
              --qdmi-config-file /opt/provider-catalogue.json \
              -- sh -ec 'mqt-core-qdmi-check --device amazon.braket.sv1 --timeout 30; exec python3 /workload/test/slurm/probe.py'
            echo "Slurm $mode: eight SV1 shots through each of Qiskit and PennyLane passed." >> "$GITHUB_STEP_SUMMARY"
          done
