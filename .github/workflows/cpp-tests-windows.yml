name: 🇨 • Tests • windows
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          The Windows runner image to use. Defaults to 'windows-latest'.
          This can be any valid Windows runner image, such as 'windows-2022' or 'windows-2025'.
        default: "windows-latest"
        type: string
      config:
        description: >
          The build type to use. Defaults to 'Release'.
          This can be any valid CMake build type, such as 'Debug' or 'Release'.
        default: "Release"
        type: string

defaults:
  run:
    shell: pwsh

jobs:
  cpp-tests-windows:
    name: 🏁 ${{ inputs.runs-on }} ${{ inputs.config }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Set up ccache for faster C++ builds
      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@802ec72ba1d54bbf75c52f45367253d6abec30f5 # v1.5.8
        with:
          prepend_symlinks_to_path: false
          override_cache_key: c++-tests-${{ inputs.runs-on }}-${{ inputs.config }}
          windows_compile_environment: msvc
      - name: Configure CMake
        env:
          CONFIG: ${{ inputs.config }}
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE="$env:CONFIG"
          -DBUILD_AMAZON_BRAKET_LIVE_TESTS=OFF --log-level=VERBOSE
      - name: Build
        env:
          CONFIG: ${{ inputs.config }}
        run: cmake --build build --config $env:CONFIG --verbose
      - name: Test
        env:
          CONFIG: ${{ inputs.config }}
        run: ctest -C $env:CONFIG --output-on-failure --test-dir build --timeout 600 --verbose
