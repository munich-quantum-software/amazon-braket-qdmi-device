name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-detection:
    name: 🔍 Change
    permissions:
      pull-requests: read
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-change-detection.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      additional-cpp-files: >-
        [".github/workflows/cpp-*.yml", ".github/workflows/live-tests.yml"]
      additional-python-files: >-
        [".github/workflows/live-tests.yml", ".github/workflows/python-*.yml"]

  cpp-tests-ubuntu:
    name: 🇨 Test 🐧
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
        preset:
          - release
        include:
          - runs-on: ubuntu-26.04
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      apt-packages: libcurl4-openssl-dev
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-macos:
    name: 🇨 Test 🍎
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - macos-26
        preset:
          - release
        include:
          - runs-on: macos-26
            preset: debug
    uses: $/.github/workflows/cpp-tests-macos.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-tests-windows:
    name: 🇨 Test 🏁
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - windows-2025
        preset:
          - release
        include:
          - runs-on: windows-2025
            preset: debug
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-windows.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      runs-on: ${{ matrix.runs-on }}
      preset-name: ${{ matrix.preset }}

  cpp-sanitizers:
    name: 🇨 Sanitizers
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      apt-packages: libcurl4-openssl-dev
      runs-on: ubuntu-26.04
      preset-name: sanitizers

  cpp-coverage:
    name: 🇨 Coverage
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    permissions:
      contents: read
      id-token: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-coverage.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      apt-packages: libcurl4-openssl-dev

  cpp-linter:
    name: 🇨 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-linter)
    permissions:
      contents: read
      pull-requests: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-linter.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      apt-packages: libcurl4-openssl-dev
      files-changed-only: true
      cpp-linter-extra-args: "-Wunused-template"

  python-tests:
    name: 🐍 Test
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-tests.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      apt-packages: libcurl4-openssl-dev
      runs-on: ubuntu-26.04
      sessions: '["tests", "minimums"]'
      draft-sessions: '["tests-3.15", "minimums-3.15"]'

  python-coverage:
    name: 🐍 Coverage
    needs: python-tests
    permissions:
      contents: read
      id-token: write
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-coverage.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0

  python-linter:
    name: 🐍 Lint
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-linter)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-linter.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0
    with:
      enable-ty: true
      enable-mypy: false

  cpp-install-tests:
    name: 📦 C++ installation
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-cpp-tests)
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
          - windows-2025
    uses: $/.github/workflows/cpp-install-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}

  packaging:
    name: 🐍 Packaging
    needs: change-detection
    if: fromJSON(needs.change-detection.outputs.run-python-tests) || fromJSON(needs.change-detection.outputs.run-cd)
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-python-packaging-cibuildwheel.yml@ffe0f2765a034310f50e3e17715e744daf9789b1 # v3.0.0

  live-tests:
    name: ☁️ Live tests
    needs: change-detection
    if: >-
      (
        fromJSON(needs.change-detection.outputs.run-cpp-tests)
        || fromJSON(needs.change-detection.outputs.run-python-tests)
      )
      && (
        github.event_name != 'workflow_dispatch'
        || github.ref == 'refs/heads/main'
      )
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/live-tests.yml
    with:
      suite: metadata

  required-checks-pass:
    name: 🚦 Check
    needs:
      - change-detection
      - cpp-tests-ubuntu
      - cpp-tests-macos
      - cpp-tests-windows
      - cpp-sanitizers
      - cpp-coverage
      - cpp-linter
      - python-tests
      - python-coverage
      - python-linter
      - cpp-install-tests
      - packaging
      - live-tests
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-tests-ubuntu,cpp-tests-macos,cpp-tests-windows,cpp-sanitizers,cpp-install-tests,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-tests)
              && 'cpp-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-cpp-linter)
              && 'cpp-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && 'python-tests,python-coverage,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-linter)
              && 'python-linter,' || ''
            }}
            ${{
              !fromJSON(needs.change-detection.outputs.run-python-tests)
              && !fromJSON(needs.change-detection.outputs.run-cd)
              && 'packaging,' || ''
            }}
            ${{
              (
                !fromJSON(needs.change-detection.outputs.run-cpp-tests)
                && !fromJSON(needs.change-detection.outputs.run-python-tests)
                || github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name != github.repository
                || github.event_name == 'workflow_dispatch'
                && github.ref != 'refs/heads/main'
              )
              && 'live-tests,' || ''
            }}
          jobs: ${{ toJSON(needs) }}
