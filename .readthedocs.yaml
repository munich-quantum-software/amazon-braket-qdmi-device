version: 2

formats:
  - htmlzip

sphinx:
  configuration: docs/conf.py

build:
  os: ubuntu-24.04
  apt_packages:
    - doxygen
    - libcurl4-openssl-dev
    - libzstd-dev
    - zstd
  tools:
    python: "3.14"
  jobs:
    pre_build:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      # Temporary: remove with the Core release pin when source builds are unnecessary.
      - curl -LsSf https://github.com/munich-quantum-software/setup-mlir/releases/download/v1.4.2/setup-mlir.sh | bash -s -- -v 23.1.1 -p $HOME/mlir
    build:
      html:
        - MLIR_DIR=$HOME/mlir/lib/cmake/mlir uvx nox --non-interactive -s docs
        - mkdir -p $READTHEDOCS_OUTPUT/html && cp -R docs/_build/html/. $READTHEDOCS_OUTPUT/html
      htmlzip:
        - |
          mkdir -p $READTHEDOCS_OUTPUT/htmlzip
          archive=$(realpath $READTHEDOCS_OUTPUT/htmlzip/html.zip)
          (cd docs/_build/html && zip -r $archive .)
